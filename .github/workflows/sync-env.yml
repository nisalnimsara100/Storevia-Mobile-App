name: Sync Env Template
on:
  push:
    branches: [ '**' ]
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: # Add this to allow the action to push changes
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run sync script
        run: node scripts/sync-env.js
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add env.text
          git commit -m "chore: auto-update env.text template" || echo "No changes to commit"
          git push
